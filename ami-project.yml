name: AMI-xcodegen
attributes:
  ORGANIZATIONNAME: DINUM
  
fileGroups:
- ami-project.yml
- ami-targets.yml

options:
  developmentLanguage: fr
  groupSortPosition: bottom
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'
  groupOrdering:
  - order:
    - AMI
  - pattern: AMI
    order:
    - Sources
    - Resources
    - SupportingFiles
  fileTypes:
    icon:
      file: true # for Xcode 26: https://github.com/yonaskolb/XcodeGen/issues/1556
  preGenCommand: |
    echo "Creating empty generated files if needed for xcodegen to use them at project generation…"
    mkdir -p AMI/Sources/Generated
    touch AMI/Sources/Generated/Assets-Generated.swift
    touch AMI/Sources/Generated/Secrets-Generated.swift
    touch AMI/Sources/Generated/Strings-Generated.swift
      
settings:
  DEVELOPMENT_TEAM: NVMQD635C6
#  CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
#  ENABLE_BITCODE: false
  MARKETING_VERSION: 0.4
  CURRENT_PROJECT_VERSION: 1
  SUPPORTS_MACCATALYST: false
  TARGETED_DEVICE_FAMILY: iPhone, iPad
  
include:
- path: ami-targets.yml

packages:
  AMI-Design-System:
    url: https://github.com/numerique-gouv/ami-design-system-ios
#    version: 0.2.0
    revision: 6709605dc8c628414611fb8d57f0143ddb92fdd4
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    version: 12.7.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    minorVersion: 4.2.2
  SwiftUI-Introspect:
    url: https://github.com/siteline/swiftui-introspect.git
    version: 26.0.0
