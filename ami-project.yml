name: AMI-xcodegen
attributes:
  ORGANIZATIONNAME: DINUM
  
fileGroups:
- ami-project.yml
- ami-targets.yml

options:
  developmentLanguage: fr
  groupSortPosition: bottom
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'
  groupOrdering:
  - order:
    - AMI
  - pattern: AMI
    order:
    - Sources
    - Resources
    - SupportingFiles
  fileTypes:
    icon:
      file: true # for Xcode 26: https://github.com/yonaskolb/XcodeGen/issues/1556

settings:
  DEVELOPMENT_TEAM: NVMQD635C6
#  CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
#  ENABLE_BITCODE: false
  MARKETING_VERSION: 0.3
  CURRENT_PROJECT_VERSION: 1
  SUPPORTS_MACCATALYST: false
  TARGETED_DEVICE_FAMILY: iPhone, iPad
  
include:
- path: ami-targets.yml

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    version: 12.7.0
  SwiftUI-Introspect:
    url: https://github.com/siteline/swiftui-introspect.git
    version: 26.0.0
  AMI-Design-System:
    url: https://github.com/numerique-gouv/ami-design-system-ios
#    version: 0.1.0
    revision: fbf13bbf58946a21128eb7aeca9f507b577179e9
