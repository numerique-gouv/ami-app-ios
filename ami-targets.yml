name: AMI
#--------------------------------------------------------------------------------
schemeTemplates:
  BaseScheme:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        ${scheme_name}:
        - running
        - testing
        - profiling
        - analyzing
        - archiving
    profile:
      config: Release
    run:
      config: Debug
    archive:
      config: Release
#--------------------------------------------------------------------------------
schemes:
  AMI-Production:
    templates:
      - BaseScheme
  AMI-Preproduction:
    templates:
      - BaseScheme
  AMI-Staging:
    templates:
      - BaseScheme
  AMI-UnitTests:
    build:
      targets:
        AMI-UnitTests:
          - testing
    test:
      targets:
        - AMI-UnitTests
    run:
      config: Debug
#--------------------------------------------------------------------------------
targetTemplates:
  BaseTarget:
    platform: iOS
    type: application

    info:
      properties:
        UILaunchScreen:
          UIColorName: colors/background-color
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationPortraitUpsideDown,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight
        ]
        ITSAppUsesNonExemptEncryption: false
#        NSCameraUsageDescription: To take pictures or videos and send them as a message $(APP_DISPLAY_NAME) needs access to the camera.
#        NSMicrophoneUsageDescription: To record and send messages with audio, $(APP_DISPLAY_NAME) needs to access the microphone.
#        NSPhotoLibraryAddUsageDescription: This lets you save images and videos to your photo library.
#        NSLocationWhenInUseUsageDescription: Grant location access so that $(APP_DISPLAY_NAME) can share your location.
        NSFaceIDUsageDescription: Face ID is used to access sensitive data.
        UIBackgroundModes: [
          remote-notification
        ]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: []
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UILaunchScreen: {}
# Disable Firebase swizzling to have AppDelegate callback in SwiftUI app: https://firebase.google.com/docs/cloud-messaging/ios/get-started#disable-swizzling
        FirebaseAppDelegateProxyEnabled: false
        
    entitlements:
      properties:
# aps-environment will be overriden at application signing step.
# If signing with a Development profile, its value will be `developmenet`.
# If signing with a Distribution profile, its value will be `production`.
# Set it to `development` by default for unsigned application.
        aps-environment: development
# macOS version only
        # Restrict application execution to its sandbox (only for macos version, ont iOS that is always sandboxed).
        com.apple.security.app-sandbox: true
        # Allow a macos sandboxed application to initiate conections to remote hosts.
        com.apple.security.network.client: true


    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: AMI/Resources/Preview
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false # Done by SwiftGen
#         SWIFT_OBJC_BRIDGING_HEADER: Project-Bridging-Header.h
#         SWIFT_OBJC_INTERFACE_HEADER_NAME: GeneratedInterface-Swift.h

      configs:
        Debug:
          ENABLE_TESTABILITY: YES # Enable testability in Debug mode for Tests targets.
      
    preBuildScripts:
    - name: 🛠 SwiftGen
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        scripts/ami-xcode-pass-swiftgen.sh
      outputFiles:
        - "$SRCROOT/AMI/Sources/Generated/Assets-Generated.swift"        
        - "$SRCROOT/AMI/Sources/Generated/Strings-Generated.swift"                  
                
    postCompileScripts:
    - name: ⚠️ SwiftLint
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        scripts/ami-xcode-pass-swiftlint.sh
        
    - name: 🧹 SwiftFormat
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        scripts/ami-xcode-pass-swiftformat.sh

    dependencies:
    - package: AMI-Design-System
      product: AmiDesignSystem
    - package: Firebase
      product: FirebaseCore
      embed: false
    - package: Firebase
      product: FirebaseMessaging
      embed: false
    - package: KeychainAccess
    - package: SwiftUI-Introspect
      product: SwiftUIIntrospect
      embed: false
    
    sources:
    - path: AMI
      excludes:
        - "**/*.md" # excludes all files with the .md extension
        
  BaseTestTarget:
    platform: iOS
    type: bundle.unit-test

    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)
    
    dependencies:
    - package: AMI-Design-System
      product: AmiDesignSystem
    - package: Firebase
      product: FirebaseCore
      embed: false
    - package: Firebase
      product: FirebaseMessaging
      embed: false
    - package: KeychainAccess
    - package: SwiftUI-Introspect
      product: SwiftUIIntrospect
      embed: false
    
#    sources:
# Don't list main app sources files. They will be used through dependency/target to main app.
#    - path: AMI

#--------------------------------------------------------------------------------
targets:
#--------------------------------------------------------------------------------
  AMI-Production:
    templates: 
      - BaseTarget

    info:
      path: targets/production/SupportingFiles/Info.plist

    entitlements: # generated by xcodegen
      path: targets/production/SupportingFiles/ami.entitlements
        
    settings:
      base:
        BASE_BUNDLE_IDENTIFIER: fr.gouv.ami
        PRODUCTION_APP_NAME: AMI PRODUCTION
        APP_NAME: AMI-Production
        APP_DISPLAY_NAME: AMI # The name used in the application.
        CODE_SIGN_ENTITLEMENTS: targets/production/SupportingFiles/ami.entitlements
        OTHER_SWIFT_FLAGS: $(inherited) -D IS_MAIN_APP -D IS_AMI_PRODUCTION

    preBuildScripts:
    - name: 🔐 Generate Secrets 
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      inputFiles:
        - "$SRCROOT/targets/production/SupportingFiles/.env.ami-production"
      outputFiles:
        - "$SRCROOT/AMI/Sources/Generated/Secrets-Generated.swift"        
      shell: /bin/sh
      script: |
        scripts/ami-xcode-pass-generate-secrets.sh \
          "$SRCROOT/targets/production/SupportingFiles/.env.ami-production" \
          "$SRCROOT/AMI/Sources/Generated/Secrets-Generated.swift"

    sources:
    - path: targets/production/SupportingFiles
      excludes:
        - "*.env" # excludes all files with the .env extension
        - ".env.*" # excludes all files with the .env prefix
#--------------------------------------------------------------------------------
  AMI-Preproduction:
    templates: 
      - BaseTarget

    info: # target the same file as Production target
      path: targets/production/SupportingFiles/Info.plist

    entitlements: # generated by xcodegen
      path: targets/preproduction/SupportingFiles/ami.entitlements
      properties:
        aps-environment: production
        
    settings:
      base:
        BASE_BUNDLE_IDENTIFIER: fr.gouv.ami.preproduction
        PRODUCTION_APP_NAME: AMI PREPRODUCTION
        APP_NAME: AMI-Preproduction
        APP_DISPLAY_NAME: AMI PreProd # The name used in the application.
        CODE_SIGN_ENTITLEMENTS: targets/preproduction/SupportingFiles/ami.entitlements
        # Don't add `IS_AMI_PREPRODUCTION` flag, but use `IS_AMI_PRODUCTION` to use the exact saame code as Production.
        OTHER_SWIFT_FLAGS: $(inherited) -D IS_MAIN_APP -D IS_AMI_PRODUCTION

    preBuildScripts:
    - name: 🔐 Generate Secrets 
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      inputFiles:
        - "$SRCROOT/targets/preproduction/SupportingFiles/.env.ami-preproduction"
      outputFiles:
        - "$SRCROOT/AMI/Sources/Generated/Secrets-Generated.swift"        
      shell: /bin/sh
      script: |
        scripts/ami-xcode-pass-generate-secrets.sh \
          "$SRCROOT/targets/preproduction/SupportingFiles/.env.ami-preproduction" \
          "$SRCROOT/AMI/Sources/Generated/Secrets-Generated.swift"

    sources:
     # target the same file as Production target
    - path: targets/production/SupportingFiles
#--------------------------------------------------------------------------------
  AMI-Staging:
    templates: 
      - BaseTarget

    info:
      path: targets/staging/SupportingFiles/Info.plist

    entitlements: # generated by xcodegen
      path: targets/staging/SupportingFiles/ami.entitlements
      properties:
        com.apple.developer.associated-domains:
        - webcredentials:ami-back-staging-pr1113.osc-fr1.scalingo.io
        
    settings:
      base:
        BASE_BUNDLE_IDENTIFIER: fr.gouv.ami.staging
        PRODUCTION_APP_NAME: AMI STAGING
        APP_NAME: AMI-Staging
        APP_DISPLAY_NAME: AMI staging # The name used in the application.
        CODE_SIGN_ENTITLEMENTS: targets/staging/SupportingFiles/ami.entitlements
        OTHER_SWIFT_FLAGS: $(inherited) -D IS_MAIN_APP -D IS_AMI_STAGING

    preBuildScripts:
    - name: 🔐 Generate Secrets 
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      inputFiles:
        - "$SRCROOT/targets/staging/SupportingFiles/.env.ami-staging"
      outputFiles:
        - "$SRCROOT/AMI/Sources/Generated/Secrets-Generated.swift"        
      shell: /bin/sh
      script: |
        scripts/ami-xcode-pass-generate-secrets.sh \
          "$SRCROOT/targets/staging/SupportingFiles/.env.ami-staging" \
          "$SRCROOT/AMI/Sources/Generated/Secrets-Generated.swift"

    sources:
    - path: targets/staging/Sources
    - path: targets/staging/SupportingFiles
      excludes:
        - "*.env" # excludes all files with the .env extension
        - ".env.*" # excludes all files with the .env prefix
#--------------------------------------------------------------------------------
  AMI-UnitTests:
    templates: 
      - BaseTestTarget

    info:
      path: targets/unitTests/SupportingFiles/Info.plist

    settings:
      base:
        BASE_BUNDLE_IDENTIFIER: fr.gouv.ami.unitTests
        APP_NAME: AMI-UnitTests
        APP_DISPLAY_NAME: AMI Unit Tests # The name used in the application.
        CODE_SIGN_ENTITLEMENTS: targets/staging/SupportingFiles/ami.entitlements
        OTHER_SWIFT_FLAGS: $(inherited) -D IS_MAIN_APP -D IS_AMI_UNIT_TESTS
      
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AMI-Staging.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AMI-Staging
        BUNDLE_LOADER: $(TEST_HOST)
    
    dependencies:
      - target: AMI-Staging

    sources:
    - path: targets/unitTests/Sources
    - path: targets/unitTests/SupportingFiles
      excludes:
        - "*.env" # excludes all files with the .env extension
        - ".env.*" # excludes all files with the .env prefix
#--------------------------------------------------------------------------------
